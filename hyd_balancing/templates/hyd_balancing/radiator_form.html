{% extends 'hyd_balancing/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Radiator Form{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0">{% if object %}Edit{% else %}Add{% endif %} Radiator {% if room %}to {{ room.name }}{% endif %}</h4>
            </div>
            <div class="card-body">
                {% crispy form %}
            </div>
        </div>
        <div class="mt-3">
             <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
