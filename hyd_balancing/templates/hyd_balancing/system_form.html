{% extends 'hyd_balancing/base.html' %}
{% load crispy_forms_tags %}

{% block title %}System Form{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">{% if object %}Edit{% else %}New{% endif %} Heating System</h4>
            </div>
            <div class="card-body">
                {% crispy form %}
            </div>
        </div>
        <div class="mt-3">
             <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
