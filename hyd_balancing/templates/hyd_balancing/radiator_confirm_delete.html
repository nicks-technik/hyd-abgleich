{% extends 'hyd_balancing/base.html' %}

{% block title %}Confirm Delete Radiator{% endblock %}

{% block content %}
<div class="alert alert-danger">
    <h4 class="alert-heading">Confirm Deletion</h4>
    <p>Are you sure you want to delete the radiator "<strong>{{ object.name }}</strong>"?</p>
    <hr>
    <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete it</button>
        <a href="{% url 'system_detail' object.room.system.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
