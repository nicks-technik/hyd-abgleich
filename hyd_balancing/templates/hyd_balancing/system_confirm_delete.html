{% extends 'hyd_balancing/base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="alert alert-danger">
    <h4 class="alert-heading">Confirm Deletion</h4>
    <p>Are you sure you want to delete the heating system "<strong>{{ object.name }}</strong>"? This will also delete all associated rooms and radiators.</p>
    <hr>
    <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete it</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
