{% extends 'hyd_balancing/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Room Form{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">{% if object %}Edit{% else %}Add{% endif %} Room {% if system %}to {{ system.name }}{% endif %}</h4>
            </div>
            <div class="card-body">
                {% crispy form %}
            </div>
        </div>
        <div class="mt-3">
             <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const lengthInput = document.getElementById('id_length_m');
        const widthInput = document.getElementById('id_width_m');
        const areaInput = document.getElementById('id_area_sqm');

        function updateArea() {
            const length = parseFloat(lengthInput.value);
            const width = parseFloat(widthInput.value);
            if (!isNaN(length) && !isNaN(width)) {
                areaInput.value = (length * width).toFixed(2);
            }
        }

        if (lengthInput && widthInput && areaInput) {
            lengthInput.addEventListener('input', updateArea);
            widthInput.addEventListener('input', updateArea);
        }

        const insulationSelect = document.getElementById('id_insulation_quality');
        const customDiv = document.getElementById('div_id_custom_insulation_value');

        function toggleCustom() {
            if (insulationSelect.value === 'custom') {
                customDiv.style.display = 'block';
            } else {
                customDiv.style.display = 'none';
            }
        }

        if (insulationSelect && customDiv) {
            insulationSelect.addEventListener('change', toggleCustom);
            toggleCustom(); // Init
        }
    });
</script>
{% endblock %}
